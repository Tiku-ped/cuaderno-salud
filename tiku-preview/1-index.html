<style>:root{--sky:#e8f4fb;--sky2:#bfe3f5;--sky3:#7fc4e8;--ink:#23414f;--ink2:#5d7886;--line:#dbe9f1;--white:#fff;--grey:#f3f6f8;--green:#dff5e6;--green2:#3f9c63;--yellow:#fff3cf;--yellow2:#b88a14;--red:#fde3e3;--red2:#c4474d;--peach:#ffe6d6;--lilac:#ece6fb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--sky);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
#app{max-width:520px;margin:0 auto;min-height:100vh;background:linear-gradient(#e8f4fb,#f7fbfd 280px);position:relative;padding:0 16px 118px}
h1,h2,h3,p{margin:0}
.hidden{display:none!important}
.muted{color:var(--ink2)}.small{font-size:13px}.center{text-align:center}
.top{display:flex;align-items:center;gap:12px;padding:18px 0 10px}
.top .kid{flex:1;min-width:0}
.top h1{font-size:22px;font-weight:700;line-height:1.2}
.top .age{color:var(--ink2);font-size:15px}
.avatar{width:58px;height:58px;border-radius:50%;background:var(--sky2);display:flex;align-items:center;justify-content:center;font-size:28px;overflow:hidden;flex:none;border:3px solid #fff;box-shadow:0 2px 8px rgba(35,65,79,.12)}
.avatar img{width:100%;height:100%;object-fit:cover}
.switch{border:none;background:#fff;border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;font-weight:600;color:var(--ink);box-shadow:0 1px 4px rgba(35,65,79,.1)}
.title{font-size:24px;font-weight:700;margin:14px 0 4px}
.sub{color:var(--ink2);margin-bottom:12px}
.card{background:#fff;border-radius:22px;padding:16px;margin:12px 0;box-shadow:0 2px 10px rgba(35,65,79,.07);position:relative}
.card h3{font-size:15px;color:var(--ink2);font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:6px}
.card h3 .ic{font-size:22px}
.big{font-size:28px;font-weight:700;line-height:1.15}
.card.green{background:var(--green)}.card.yellow{background:var(--yellow)}.card.red{background:var(--red)}.card.blue{background:#dff1fb}.card.lilac{background:var(--lilac)}.card.peach{background:var(--peach)}
.row{display:flex;gap:10px;align-items:center}.row.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2 .card{margin:0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border:none;border-radius:18px;background:var(--sky3);color:#fff;font:inherit;font-weight:700;font-size:17px;padding:12px 16px;cursor:pointer;text-decoration:none}
.btn.sec{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 2px var(--sky2)}
.btn.ghost{background:transparent;color:var(--ink2);box-shadow:none;font-weight:600}
.btn.green{background:var(--green2)}
.btn.red{background:var(--red2)}
.btn.small{min-height:44px;font-size:15px;width:auto;padding:8px 14px;border-radius:14px}
.btn:disabled{opacity:.5}
.hero-btn{background:linear-gradient(135deg,#7fc4e8,#5aaedb);box-shadow:0 6px 16px rgba(90,174,219,.35);margin:6px 0 4px}
.chip{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:999px;padding:8px 14px;background:#fff;font:inherit;font-size:15px;font-weight:600;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line);min-height:40px;cursor:pointer}
.chip.on{background:var(--sky3);color:#fff;box-shadow:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;margin-left:-16px;margin-right:-16px;padding-left:16px;padding-right:16px}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700}
.pill.ok{background:var(--green);color:var(--green2)}.pill.soon{background:var(--yellow);color:var(--yellow2)}.pill.late{background:var(--red);color:var(--red2)}.pill.later{background:var(--grey);color:var(--ink2)}.pill.opt{background:var(--lilac);color:#6a56b0}
label.f{display:block;font-weight:600;font-size:15px;margin:12px 0 0}
input.i,select.i,textarea.i{display:block;width:100%;margin-top:6px;border:2px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit;font-size:17px;background:#fff;color:var(--ink);min-height:50px}
input.i:focus,select.i:focus,textarea.i:focus{outline:none;border-color:var(--sky3)}
textarea.i{min-height:84px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.back{border:none;background:none;font:inherit;font-weight:700;color:var(--ink2);padding:14px 0 4px;min-height:44px}
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;background:#fff;display:flex;padding:6px 6px calc(8px + env(safe-area-inset-bottom));border-radius:24px 24px 0 0;box-shadow:0 -4px 18px rgba(35,65,79,.1);z-index:20}
.tab{flex:1;border:none;background:none;font:inherit;font-size:12px;font-weight:600;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;min-height:56px;border-radius:16px}
.tab .e{font-size:24px}
.tab.on{color:var(--ink);background:var(--sky)}
.sos{position:fixed;right:max(14px,calc(50% - 246px));bottom:calc(86px + env(safe-area-inset-bottom));z-index:25;width:62px;height:62px;border-radius:50%;border:none;background:#e9777d;color:#fff;font-weight:800;font-size:15px;box-shadow:0 6px 16px rgba(196,71,77,.4)}
.timeline{position:relative;margin-left:14px;border-left:3px solid var(--sky2);padding-left:18px}
.ev{position:relative;background:#fff;border-radius:18px;padding:12px 14px;margin:0 0 12px;box-shadow:0 2px 8px rgba(35,65,79,.06)}
.ev::before{content:attr(data-ic);position:absolute;left:-36px;top:10px;width:34px;height:34px;border-radius:50%;background:var(--ev,#bfe3f5);display:flex;align-items:center;justify-content:center;font-size:18px;border:3px solid #f4fafd}
.ev .d{font-size:13px;color:var(--ink2);font-weight:600}
.ev .t{font-weight:700}
.check{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:12px 14px;margin:8px 0;box-shadow:0 1px 5px rgba(35,65,79,.06);border:none;width:100%;text-align:left;font:inherit;color:var(--ink);min-height:60px}
.check .box{flex:none;width:30px;height:30px;border-radius:10px;border:3px solid var(--sky2);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800}
.check.ok .box{background:var(--green2);border-color:var(--green2)}
.check.soon .box{border-color:#e3b93e}.check.late .box{border-color:#e48e92}
.check .n{font-weight:700}.check .s{font-size:13px;color:var(--ink2)}
.agehead{font-weight:800;font-size:15px;color:var(--ink2);margin:18px 0 2px;display:flex;align-items:center;gap:8px}
.sheet-bg{position:fixed;inset:0;background:rgba(35,65,79,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:26px 26px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.sheet h2{font-size:21px;margin-bottom:6px}
.full{position:fixed;inset:0;background:#fff;z-index:50;overflow:auto;padding:20px 18px 40px;max-width:520px;margin:0 auto}
.full .hd{background:var(--red);color:var(--red2);border-radius:18px;padding:14px;font-weight:800;font-size:20px;text-align:center;margin-bottom:12px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.kv b{font-size:14px;color:var(--ink2);font-weight:600}.kv span{font-weight:700;text-align:right}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:110px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:18px;z-index:60;font-weight:600;font-size:15px;max-width:90%;width:max-content}
.steps .step{background:#fff;border-radius:20px;padding:14px 16px;margin:12px 0;box-shadow:0 2px 8px rgba(35,65,79,.06)}
.steps .step h3{font-size:17px;display:flex;align-items:center;gap:10px;margin-bottom:4px}
.steps .num{width:28px;height:28px;border-radius:50%;background:var(--sky3);color:#fff;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.medrow{background:var(--grey);border-radius:16px;padding:10px 12px;margin:10px 0}
svg.chart{width:100%;height:auto;display:block}
.photo-thumb{width:64px;height:64px;border-radius:12px;object-fit:cover;background:var(--grey)}
.lock{display:flex;flex-direction:column;align-items:center;gap:14px;padding:80px 0;text-align:center}
.mascot{width:120px;height:120px}
.seg{display:flex;background:var(--grey);border-radius:14px;padding:4px;gap:4px;margin:8px 0}
.seg button{flex:1;border:none;background:none;border-radius:11px;padding:10px 4px;font:inherit;font-weight:700;font-size:14px;color:var(--ink2);min-height:44px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(35,65,79,.12)}
.warn{background:var(--yellow);color:#6b5210;border-radius:14px;padding:10px 12px;font-size:14px;margin:8px 0}
.audio{width:100%;margin-top:8px}
.dxsel{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.dxchip small{color:inherit;opacity:.75}
.dxchip b{cursor:pointer;margin-left:2px}
.dxres{background:#fff;border:2px solid var(--line);border-radius:14px;margin-top:6px;overflow:hidden}
.dxitem{display:block;width:100%;text-align:left;border:none;background:none;font:inherit;padding:12px 14px;font-size:15px;border-bottom:1px solid var(--line);color:var(--ink);min-height:44px}
.dxitem:last-child{border-bottom:none}
.dxitem small{color:var(--ink2)}
.anterow{background:var(--grey);border-radius:16px;padding:10px 12px;margin:10px 0}
</style>
</head>

function chartSvg(c, cur) {

  pin: function () { var has = pinRec(); openSheet('<h2>' + (has ? 'Cambiar o quitar PIN' : 'Activar PIN') + '</h2><p class="muted small">El PIN es un seguro simple para que otros no abran la app. No encripta los datos.</p><label class="f">PIN de 4 a 6 números<input id="pin-new" class="i" type="password" inputmode="numeric" maxlength="6" pattern="[0-9]*"></label><div style="height:14px"></div><button class="btn green" data-act="pin-save">Guardar PIN</button>' + (has ? '<button class="btn sec" data-act="pin-off" style="margin-top:8px">Quitar PIN</button>' : '') + '<button class="btn ghost" data-act="sheet-close">Cancelar</button>'); },
  'pin-save': function () { var p = val('pin-new'); if (!/^\d{4,6}$/.test(p)) { toast('El PIN debe tener 4 a 6 números'); return; } var salt = uid(); hashPin(p, salt).then(function (hh) { localStorage.setItem(PIN_KEY, JSON.stringify({ salt: salt, hash: hh })); closeSheet(); toast('PIN activado'); render(); }); },
  'pin-off': function () { localStorage.removeItem(PIN_KEY); closeSheet(); toast('PIN quitado'); render(); },
  notif: function () { if (typeof Notification === 'undefined') { toast('Este navegador no permite avisos. En iPhone, agrega Tiku a la pantalla de inicio primero.'); return; } Notification.requestPermission().then(function (p) { toast(p === 'granted' ? 'Avisos activados (con la app abierta)' : 'No se activaron los avisos'); }); },
  'dx-add': function (e) { var box = e.closest('[data-dxbox]'); box.querySelector('.dxsel').insertAdjacentHTML('beforeend', dxChipHtml({ name: e.getAttribute('data-name'), code: e.getAttribute('data-code') })); var q = box.querySelector('[data-role="dxq"]'); q.value = ''; box.querySelector('.dxres').classList.add('hidden'); q.focus(); },
  'dx-other': function (e) { var box = e.closest('[data-dxbox]'); var q = box.querySelector('[data-role="dxq"]'); var t = q.value.trim(); if (!t) return; box.querySelector('.dxsel').insertAdjacentHTML('beforeend', dxChipHtml({ name: t, code: '' })); q.value = ''; box.querySelector('.dxres').classList.add('hidden'); q.focus(); },
  'dx-rm': function (e) { var ch = e.closest('.dxchip'); if (ch) ch.remove(); },
  'cf-addante': function () { $('cf-ante').insertAdjacentHTML('beforeend', anteNewRowHtml()); },
  'cf-rmante': function (e) { var r = e.closest('.anterow'); if (r) r.remove(); },
  'ante-del': function (e) { if (!confirm('¿Quitar este antecedente?')) return; del('events', e.dataset.v).then(function () { return load(); }).then(function () { S.scr = { name: 'childForm', edit: true }; render(); }); },
  'rem-new': function () { openSheet('<h2>Agregar recordatorio</h2><p class="muted small">Ej: control con el dentista, examen de sangre, hora al otorrino.</p><label class="f">Qué hay que recordar<input id="rm-title" class="i" placeholder="Ej: Control dental"></label><label class="f">Fecha<input id="rm-date" class="i" type="date" value="' + todayISO() + '"></label><div style="height:14px"></div><button class="btn green" data-act="rem-save">Guardar</button><button class="btn ghost" data-act="sheet-close">Cancelar</button>'); },
  'rem-save': function () { var c = child(), t = val('rm-title'), d = val('rm-date'); if (!t || !d) { toast('Falta qué recordar o la fecha'); return; } put('reminders', { id: uid(), childId: c.id, kind: 'custom', title: t, date: d, done: false }).then(function () { closeSheet(); return load(); }).then(function () { toast('Recordatorio guardado'); }); },
  'rem-done': function (e) { var r = S.reminders.find(function (x) { return x.id === e.dataset.v; }); if (!r) return; put('reminders', Object.assign({}, r, { done: true })).then(load); },
  'rem-del': function (e) { if (!confirm('¿Eliminar este recordatorio?')) return; del('reminders', e.dataset.v).then(load); },
  about: function () { S.scr = { name: 'about' }; render(); window.scrollTo(0, 0); },
  sos: function () { var d = document.createElement('div'); d.innerHTML = sosHtml(child()); document.body.appendChild(d.firstChild); },
  'sos-close': function () { var e = $('sos-full'); if (e) e.remove(); }
};
document.addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-act]'); if (!el) return; var f = ACT[el.dataset.act]; if (f) { ev.preventDefault(); f(el); }
});
document.addEventListener('input', function (ev) {
  if (ev.target.getAttribute && ev.target.getAttribute('data-role') === 'dxq') { dxSearchRender(ev.target.closest('[data-dxbox]'), ev.target.value); return; }
  if (ev.target.id === 'pin' && ev.target.value.length >= 4) { var rec = pinRec(); if (!rec) return; hashPin(ev.target.value, rec.salt).then(function (hh) { if (hh === rec.hash) { S.locked = false; render(); checkNotify(); } else if (ev.target.value.length >= 6) { var e = $('pin-err'); if (e) e.classList.remove('hidden'); ev.target.value = ''; } }); }
});
document.addEventListener('change', function (ev) {
  if (ev.target.id === 'restore' && ev.target.files[0]) restore(ev.target.files[0]);
});
window.addEventListener('hashchange', function () { if (/demo/.test(location.hash) !== DEMO) location.reload(); });
document.addEventListener('visibilitychange', function () { if (!document.hidden && db) { checkNotify(); } });

// ---------- Inicio ----------
render();
openDb().then(function (d) { db = d; return DEMO ? seedDemo() : null; }).then(load).catch(function (e) { S.err = e && e.message || String(e); render(); });
// Preview: no service worker registration; existing app caches stay untouched.
})();
</script>
</body>
